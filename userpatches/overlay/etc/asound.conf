# NanoAir default capture devices.
#
# ac108: H3 master + BCLK-PLL (0 ppm coherent). pll_bclk needs /dev/i2c
# access (record as root, e.g. from an adb root shell); without it the
# plugin automatically falls back to the crystal PLL and warns.
#   arecord -D ac108 -c 4 -f S32_LE -r 48000  (or -r 16000)
pcm.ac108 { type ac108  slavepcm "hw:1,0"  pll_bclk 1 }

# Crystal-PLL variant (-3.8 ppm, no root needed).
pcm.ac108xtl { type ac108  slavepcm "hw:1,0" }
