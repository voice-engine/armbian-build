# NanoAir default capture devices.
#
# Rate and PLL switching are handled entirely by the in-tree snd-soc-ac108c
# codec driver (hw_params + trigger), so there is no pll_bclk option here
# anymore; both devices below behave identically.
#   arecord -D ac108 -c 4 -f S32_LE -r 48000  (or -r 16000, -f S16_LE)
pcm.ac108 { type ac108  slavepcm "hw:1,0" }

# Historical crystal-PLL alias (now the same stream as ac108).
pcm.ac108xtl { type ac108  slavepcm "hw:1,0" }
